<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fallback del HTML crudo: lo que ven WhatsApp, Facebook e Instagram,
      que NO ejecutan JavaScript. Deben coincidir con los de la home.

      El data-rh="true" es necesario: react-helmet-async solo reemplaza los
      tags marcados con ese atributo. Sin la marca, estos quedarían duplicados
      junto a los que inyecta SEO.tsx en cada página (dos canonical distintos
      hacen que Google ignore los dos).
    -->
    <title>Venta y Reparación de Electrobombas en Mendoza y San Juan | Arenas Electrobombas</title>
    <meta data-rh="true" name="description" content="Arenas Electrobombas: venta, reparación y alquiler de electrobombas en Mendoza y San Juan. Perforación de pozos, bobinados, filmaciones y extracción. +20 años de experiencia." />
    <link data-rh="true" rel="canonical" href="https://www.arenaselectrobombas.com.ar/" />

    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Arenas Electrobombas" />
    <meta data-rh="true" property="og:locale" content="es_AR" />
    <meta data-rh="true" property="og:title" content="Venta y Reparación de Electrobombas en Mendoza y San Juan" />
    <meta data-rh="true" property="og:description" content="Venta, reparación y alquiler de electrobombas en Mendoza y San Juan. Perforación de pozos, bobinados, filmaciones y extracción. +20 años de experiencia." />
    <meta data-rh="true" property="og:url" content="https://www.arenaselectrobombas.com.ar/" />
    <meta data-rh="true" property="og:image" content="https://www.arenaselectrobombas.com.ar/og-image.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="Equipo de Arenas Electrobombas trabajando en una perforación de pozo de agua" />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Venta y Reparación de Electrobombas en Mendoza y San Juan" />
    <meta data-rh="true" name="twitter:description" content="Venta, reparación y alquiler de electrobombas en Mendoza y San Juan. Perforación de pozos, bobinados, filmaciones y extracción." />
    <meta data-rh="true" name="twitter:image" content="https://www.arenaselectrobombas.com.ar/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
